<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Task History & Status Controller</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a !important;
            color: #f8fafc !important;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 3px; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .unified-glass-panel {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.35);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .calendar-day-cell {
            aspect-ratio: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s ease;
        }
        .calendar-day-cell.inactive-day {
            opacity: 0.3;
            background: rgba(15, 23, 42, 0.2);
        }
        .calendar-day-cell.active-today {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }
        .calendar-day-cell.completed-day {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
        }
        .history-card {
            animation: fadeIn 0.2s ease-out forwards;
            background: rgba(15, 23, 42, 0.7) !important;
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 16px;
        }
        .custom-modal-bg { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }
        .custom-modal-box {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(30, 41, 59, 0.98) 100%);
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Custom Popup Modal -->
    <div id="custom-modal" class="fixed inset-0 z-[100] custom-modal-bg flex items-center justify-center p-4 hidden">
        <div class="custom-modal-box w-full max-w-sm rounded-3xl overflow-hidden p-6 text-center">
            <div class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center mx-auto mb-3">
                <i id="custom-modal-icon" class="fa-solid fa-circle-info text-amber-400 text-2xl"></i>
            </div>
            <h3 id="custom-modal-title" class="text-lg font-extrabold text-slate-100 mb-2">Details</h3>
            <p id="custom-modal-message" class="text-xs font-semibold text-slate-300 mb-6 leading-relaxed px-2">Info message...</p>
            <button id="custom-modal-close" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs py-3 px-4 rounded-xl transition shadow-lg active:scale-95">OK</button>
        </div>
    </div>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto p-4 pt-6">
        <div class="unified-glass-panel p-4 rounded-3xl border border-emerald-500/30 relative space-y-4">
            
            <!-- Outer Container Header -->
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-2">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-amber-400 text-sm"></i>
                    <h2 class="text-xs font-extrabold text-slate-100 tracking-wider uppercase">Task Status & History</h2>
                </div>
                <a href="dashboard.html" class="w-7 h-7 bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-slate-200 rounded-full flex items-center justify-center text-xs transition">
                    <i class="fa-solid fa-xmark"></i>
                </a>
            </div>

            <!-- Performance Summary Card -->
            <div class="bg-slate-900/40 p-3.5 rounded-2xl border border-slate-800">
                <div class="flex justify-between items-center mb-3">
                    <h2 id="summary-title" class="text-xs font-bold uppercase tracking-wider text-slate-400">Monthly Performance</h2>
                    <span id="monthly-avg-pct" class="text-sm font-extrabold text-emerald-400">0% Completed</span>
                </div>
                <!-- 4 Columns Grid -->
                <div class="grid grid-cols-4 gap-2 text-center">
                    <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                        <p class="text-[9px] text-slate-400 mb-1">Total Tracked</p>
                        <p id="stat-total-days" class="text-base font-extrabold text-slate-100">0</p>
                    </div>
                    <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                        <p class="text-[9px] text-slate-400 mb-1">Full Completed</p>
                        <p id="stat-full-days" class="text-base font-extrabold text-emerald-400">0</p>
                    </div>
                    <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                        <p class="text-[9px] text-slate-400 mb-1">Active Streak</p>
                        <p id="stat-streak" class="text-base font-extrabold text-amber-400">0 d</p>
                    </div>
                    <div class="bg-emerald-950/30 p-2.5 rounded-xl border border-emerald-500/30">
                        <p class="text-[9px] text-emerald-400/80 mb-1">All Days</p>
                        <p id="stat-all-days" class="text-base font-extrabold text-emerald-300">0</p>
                    </div>
                </div>
            </div>

            <!-- Calendar Grid Section -->
            <div class="bg-slate-900/40 p-3.5 rounded-2xl border border-slate-800">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <button onclick="changeMonth(-1)" class="w-8 h-8 bg-slate-800 text-amber-400 rounded-lg border border-slate-700 flex items-center justify-center text-xs active:scale-95"><i class="fa-solid fa-chevron-left"></i></button>
                        <div id="current-month-label" class="text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-xl min-w-[110px] text-center">
                            ...
                        </div>
                        <button onclick="changeMonth(1)" class="w-8 h-8 bg-slate-800 text-amber-400 rounded-lg border border-slate-700 flex items-center justify-center text-xs active:scale-95"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <div class="flex gap-1 text-[10px] text-slate-400">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 100%</span>
                        <span class="flex items-center gap-1 ml-2"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Partial</span>
                    </div>
                </div>
                
                <!-- Week Days Header (Fixed formatting to prevent overlapping) -->
                <div class="grid grid-cols-7 gap-1 mb-2 text-center text-[10px] font-bold text-slate-400">
                    <span>ሰኞ</span><span>ማክሰ</span><span>ረቡዕ</span><span>ሐሙስ</span><span>አርብ</span><span>ቅዳሜ</span><span>እሁድ</span>
                </div>

                <!-- Calendar Days Container -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5">
                    <!-- Dynamic Days -->
                </div>
            </div>

            <!-- History Logs List -->
            <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 px-1">History Logs</h3>
                <div id="history-logs-container" class="space-y-2.5">
                    <div class="text-center py-8 text-slate-500 text-xs">
                        <i class="fa-solid fa-spinner fa-spin text-base mb-1"></i>
                        <p>Loading history logs...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Script Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBYinVdxtvYwTjD_KKpPTpYUBlVoyknJPw",
            authDomain: "dailytaskapp-20859.firebaseapp.com",
            projectId: "dailytaskapp-20859",
            storageBucket: "dailytaskapp-20859.firebasestorage.app",
            messagingSenderId: "132633352057",
            appId: "1:132633352057:web:81bd7b2c88efbc16e881a8",
            databaseURL: "https://dailytaskapp-20859-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.database();

        const ethMonths = ["መስከረም", "ጥቅምት", "ህዳር", "ታህሳስ", "ጥር", "የካቲት", "መጋቢት", "ሚያዚያ", "ግንቦት", "ሰኔ", "ሀምሌ", "ነሐሴ", "ጳጉሜ"];
        
        let globalHistoryData = {};
        
        function getEthDateDetails(date) {
            let targetDate = new Date(date.getTime());
            
            const gYear = targetDate.getFullYear();
            const gMonth = targetDate.getMonth();
            const gDay = targetDate.getDate();
            
            let ethYear = gYear - 8;
            let sep11 = new Date(gYear, 8, 11);
            if ((ethYear + 1) % 4 === 0) {
                sep11 = new Date(gYear, 8, 12);
            }

            let dTarget = new Date(gYear, gMonth, gDay);
            let diffDays = Math.floor((dTarget - new Date(gYear, 0, 1)) / (1000 * 60 * 60 * 24)) - Math.floor((sep11 - new Date(gYear, 0, 1)) / (1000 * 60 * 60 * 24));

            if (diffDays >= 0) {
                ethYear = gYear - 7;
                let ethMonth = Math.floor(diffDays / 30);
                let ethDay = (diffDays % 30) + 1;
                if (ethMonth > 12) ethMonth = 12;
                return { day: ethDay, month: ethMonth, year: ethYear };
            } else {
                let prevEthYear = ethYear;
                let prevSep11 = new Date(gYear - 1, 8, 11);
                if ((prevEthYear + 1) % 4 === 0) {
                    prevSep11 = new Date(gYear - 1, 8, 12);
                }
                let diffPrev = Math.floor((dTarget - prevSep11) / (1000 * 60 * 60 * 24));
                let ethMonth = Math.floor(diffPrev / 30);
                let ethDay = (diffPrev % 30) + 1;
                return { day: ethDay, month: ethMonth, year: ethYear };
            }
        }

        let now = new Date();
        if (now.getHours() >= 19) {
            now.setDate(now.getDate() + 1);
        }
        let today = now;
        let currentEth = getEthDateDetails(today);
        let selectedMonth = currentEth.month;
        let selectedYear = currentEth.year;

        document.getElementById('current-month-label').innerText = ethMonths[selectedMonth] + ' ' + selectedYear;

        function showAlert(title, message) {
            document.getElementById('custom-modal-title').innerText = title;
            document.getElementById('custom-modal-message').innerText = message;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        document.getElementById('custom-modal-close').addEventListener('click', () => {
            document.getElementById('custom-modal').classList.add('hidden');
        });

        function getEthMonthStartWeekday(ethYear, ethMonth) {
            let refYear = 2019;
            let refWeekday = 4;

            let totalDaysFromRef = 0;
            for (let y = refYear; y < ethYear; y++) {
                let isLeap = (y % 4 === 3);
                totalDaysFromRef += (365 + (isLeap ? 1 : 0));
            }

            let monthsDaysCount = [30,30,30,30,30,30,30,30,30,30,30,30, (ethYear % 4 === 3 ? 6 : 5)];
            for (let m = 0; m < ethMonth; m++) {
                totalDaysFromRef += monthsDaysCount[m];
            }

            let weekday = (refWeekday + (totalDaysFromRef % 7)) % 7;
            return weekday;
        }

        function calculateTaskPercentages() {
            let devices = JSON.parse(localStorage.getItem('devices_and_accounts') || '[]');
            let totalTasks = 0;
            let completedTasks = 0;

            devices.forEach(dev => {
                if (dev.poppo) {
                    dev.poppo.forEach(p => {
                        totalTasks += 2;
                        if (localStorage.getItem(p.id + '_live') === 'true') completedTasks++;
                        if (localStorage.getItem(p.id + '_party') === 'true') completedTasks++;
                    });
                }
                Object.keys(dev).forEach(key => {
                    if (key !== 'id' && key !== 'name' && key !== 'color' && key !== 'poppo' && Array.isArray(dev[key])) {
                        dev[key].forEach(t => {
                            totalTasks++;
                            if (localStorage.getItem(t.id) === 'true') completedTasks++;
                        });
                    }
                });
            });

            let pct = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
            return { totalTasks, completedTasks, pct };
        }

        function loadUserData(userId) {
            // ዳታውን አንዴ ብቻ በፈጣን ሁኔታ እንዲጭን .once ተጠቀምን (Loading እንዳይረዝም)
            db.ref('users/' + userId + '/history').once('value').then(snapshot => {
                globalHistoryData = snapshot.val() || {};
                
                for (let d = 13; d <= 16; d++) {
                    let wrongKey = currentEth.year + '-' + (currentEth.month + 1) + '-' + d;
                    if (globalHistoryData[wrongKey]) {
                        db.ref('users/' + userId + '/history/' + wrongKey).remove();
                        delete globalHistoryData[wrongKey];
                    }
                }

                let taskStats = calculateTaskPercentages();
                let todayKey = currentEth.year + '-' + (currentEth.month + 1) + '-' + currentEth.day;
                
                let pendingSaveAndReset = localStorage.getItem('pending_save_reset');

                if (taskStats.completedTasks > 0 || pendingSaveAndReset === 'true') {
                    globalHistoryData[todayKey] = {
                        date: ethMonths[currentEth.month] + ' ' + currentEth.day + '፣ ' + currentEth.year,
                        pct: taskStats.pct,
                        completed: taskStats.completedTasks,
                        total: taskStats.totalTasks,
                        monthIndex: currentEth.month,
                        yearVal: currentEth.year,
                        dayVal: currentEth.day
                    };
                    db.ref('users/' + userId + '/history/' + todayKey).set(globalHistoryData[todayKey]);

                    if (pendingSaveAndReset === 'true') {
                        localStorage.removeItem('pending_save_reset');
                    }
                }

                renderView();
            }).catch(error => {
                console.error("Error loading history:", error);
                renderView();
            });
        }

        window.changeMonth = function(direction) {
            let nextMonth = selectedMonth + direction;
            let nextYear = selectedYear;

            if (nextMonth > 12) {
                nextMonth = 0;
                nextYear++;
            } else if (nextMonth < 0) {
                nextMonth = 12;
                nextYear--;
            }

            if (nextYear < 2019) {
                return;
            }

            selectedMonth = nextMonth;
            selectedYear = nextYear;
            renderView();
        }

        function renderView() {
            document.getElementById('current-month-label').innerText = ethMonths[selectedMonth] + ' ' + selectedYear;
            document.getElementById('summary-title').innerText = ethMonths[selectedMonth] + ' Performance';

            let daysInCurrentMonth = (selectedMonth === 12) ? ((selectedYear % 4 === 3) ? 6 : 5) : 30;
            let startWeekday = getEthMonthStartWeekday(selectedYear, selectedMonth);

            let calendarGridHtml = '';
            let monthTrackedDays = 0;
            let monthFullDays = 0;
            let monthPctSum = 0;

            let prevMonthIndex = selectedMonth - 1;
            let prevMonthYear = selectedYear;
            if (prevMonthIndex < 0) {
                prevMonthIndex = 12;
                prevMonthYear--;
            }
            let daysInPrevMonth = (prevMonthIndex === 12) ? ((prevMonthYear % 4 === 3) ? 6 : 5) : 30;

            for (let i = startWeekday - 1; i >= 0; i--) {
                let prevDayNum = daysInPrevMonth - i;
                calendarGridHtml += `
                    <div class="calendar-day-cell inactive-day">
                        <span class="text-xs font-bold text-slate-500">${prevDayNum}</span>
                        <span class="text-[9px] text-slate-600">-</span>
                    </div>
                `;
            }

            for (let d = 1; d <= daysInCurrentMonth; d++) {
                let dKey = selectedYear + '-' + (selectedMonth + 1) + '-' + d;
                let dayRecord = globalHistoryData[dKey];
                let dayPct = dayRecord ? dayRecord.pct : 0;
                
                if (dayRecord) {
                    monthTrackedDays++;
                    if (dayRecord.pct === 100) monthFullDays++;
                    monthPctSum += dayRecord.pct;
                }

                let cellClass = 'calendar-day-cell';
                if (selectedYear === currentEth.year && selectedMonth === currentEth.month && d === currentEth.day) {
                    cellClass += ' active-today';
                }
                if (dayPct === 100) cellClass += ' completed-day';

                let badgeColor = dayPct === 100 ? 'text-emerald-400' : (dayPct > 0 ? 'text-amber-400' : 'text-slate-500');

                calendarGridHtml += `
                    <div class="${cellClass}" onclick="showDayDetails('${ethMonths[selectedMonth]} ${d}፣ ${selectedYear}', '${dayPct}%', '${dayRecord ? dayRecord.completed : 0}/${dayRecord ? dayRecord.total : 0}')">
                        <span class="text-xs font-bold text-slate-200">${d}</span>
                        <span class="text-[9px] font-extrabold ${badgeColor}">${dayPct}%</span>
                    </div>
                `;
            }

            let totalCellsSoFar = startWeekday + daysInCurrentMonth;
            let remainingCells = (totalCellsSoFar % 7 === 0) ? 0 : (7 - (totalCellsSoFar % 7));
            for (let nextDay = 1; nextDay <= remainingCells; nextDay++) {
                calendarGridHtml += `
                    <div class="calendar-day-cell inactive-day">
                        <span class="text-xs font-bold text-slate-500">${nextDay}</span>
                        <span class="text-[9px] text-slate-600">-</span>
                    </div>
                `;
            }

            document.getElementById('calendar-grid').innerHTML = calendarGridHtml;

            let totalAllDaysCount = Object.keys(globalHistoryData).length;

            let avgMonthlyPct = monthTrackedDays > 0 ? Math.round(monthPctSum / monthTrackedDays) : 0;
            document.getElementById('monthly-avg-pct').innerText = avgMonthlyPct + '% Completed';
            document.getElementById('stat-total-days').innerText = monthTrackedDays;
            document.getElementById('stat-full-days').innerText = monthFullDays;
            document.getElementById('stat-streak').innerText = monthFullDays + ' d';
            document.getElementById('stat-all-days').innerText = totalAllDaysCount;

            let logsHtml = '';
            let filteredKeys = Object.keys(globalHistoryData).filter(k => {
                let item = globalHistoryData[k];
                return item.yearVal === selectedYear && item.monthIndex === selectedMonth;
            }).sort().reverse();

            if (filteredKeys.length === 0) {
                logsHtml = `<div class="text-center py-6 text-slate-500 text-xs bg-slate-900/40 rounded-xl border border-slate-800">No logs recorded for this month yet.</div>`;
            } else {
                filteredKeys.forEach(k => {
                    let item = globalHistoryData[k];
                    logsHtml += `
                        <div class="history-card p-3.5 flex items-center justify-between">
                            <div class="history-card-content flex items-center gap-3 w-full">
                                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-xs">
                                    ${item.pct}%
                                </div>
                                <div class="flex-1">
                                    <h4 class="text-xs font-bold text-slate-100">${item.date}</h4>
                                    <p class="text-[10px] text-slate-400 mt-0.5">Completed Tasks: <span class="text-slate-300 font-semibold">${item.completed} / ${item.total}</span></p>
                                </div>
                                <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-full ${item.pct === 100 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-emerald-500/30'}">
                                    ${item.pct === 100 ? 'Completed' : 'In Progress'}
                                </span>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('history-logs-container').innerHTML = logsHtml;
        }

        window.showDayDetails = function(dateStr, pctStr, tasksRatio) {
            showAlert('Day Summary: ' + dateStr, 'Completion Rate: ' + pctStr + '\nCompleted Tasks: ' + tasksRatio);
        }

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                loadUserData(user.uid);
            }
        });
    </script>
</body>
</html>
