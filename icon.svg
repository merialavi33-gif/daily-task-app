<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Rich Purple) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Phone Frame Gradient -->
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient (Amber to Emerald) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Screen Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="#a78bfa" opacity="0.1" filter="url(#glow)" />

  <!-- Smartphone Body -->
  <rect x="156" y="76" width="200" height="330" rx="36" fill="url(#phoneGrad)" stroke="#6d28d9" stroke-width="6" />

  <!-- Screen Area -->
  <rect x="174" y="98" width="164" height="286" rx="20" fill="#0f0728" />

  <!-- Dynamic Island / Notch -->
  <path d="M 220 112 L 292 112 C 298 112 300 114 300 120 C 300 126 298 128 292 128 L 220 128 C 214 128 212 126 212 120 C 212 114 214 112 220 112 Z" fill="#2e1065" />

  <!-- UI Mini Stats Header Bars -->
  <rect x="190" y="142" width="60" height="22" rx="6" fill="#2e1065" />
  <rect x="258" y="142" width="64" height="22" rx="6" fill="#2e1065" />

  <!-- Task Item 1 (Completed with Check) -->
  <rect x="190" y="176" width="132" height="38" rx="10" fill="#2e1065" opacity="0.85" />
  <circle cx="212" cy="195" r="7" fill="#10b981" />
  <path d="M 208 195 L 211 198 L 217 191" fill="none" stroke="#0f0728" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="232" y="191" width="64" height="8" rx="4" fill="#cbd5e1" />

  <!-- Task Item 2 (In Progress) -->
  <rect x="190" y="222" width="132" height="38" rx="10" fill="#2e1065" opacity="0.85" />
  <circle cx="212" cy="241" r="7" fill="#f59e0b" />
  <rect x="232" y="237" width="50" height="8" rx="4" fill="#cbd5e1" />

  <!-- Task Item 3 (Pending) -->
  <rect x="190" y="268" width="132" height="38" rx="10" fill="#2e1065" opacity="0.85" />
  <circle cx="212" cy="287" r="7" fill="#7c3aed" />
  <rect x="232" y="283" width="40" height="8" rx="4" fill="#a78bfa" />

  <!-- Progress Bar at Bottom of Screen -->
  <rect x="190" y="322" width="132" height="8" rx="4" fill="#2e1065" />
  <rect x="190" y="322" width="95" height="8" rx="4" fill="url(#accentGrad)" />

  <!-- Floating Multi-Device / Connection Nodes -->
  <g filter="url(#glow)">
    <!-- Top-Right Node -->
    <circle cx="390" cy="140" r="28" fill="#2e1065" stroke="#f59e0b" stroke-width="4" />
    <path d="M 382 140 L 388 146 L 398 134" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom-Left Node -->
    <circle cx="122" cy="330" r="28" fill="#2e1065" stroke="#10b981" stroke-width="4" />
    <circle cx="122" cy="330" r="12" fill="none" stroke="#10b981" stroke-width="3" />
    <text x="122" y="336" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">$</text>
  </g>

  <!-- Connection Lines -->
  <path d="M 336 155 Q 365 145 362 140" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,6" opacity="0.8" />
  <path d="M 176 315 Q 140 325 150 330" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6,6" opacity="0.8" />

  <!-- Background Box for Footer Text (Darker for Contrast) -->
  <rect x="106" y="416" width="300" height="54" rx="12" fill="#0f0728" opacity="0.95" />

  <!-- Bold White "CREATED BY AGB" Text at Footer -->
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    CREATED BY AGB
  </text>
</svg>
