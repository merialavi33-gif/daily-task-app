html[data-theme="dark"]{--bg:#0b0f19;--ink:#f1f5f9;--muted:#94a3b8;--line:rgba(255,255,255,.14);--field-bg:rgba(255,255,255,.055);--err:#fb7185;--vita-top:#ffffff;--vita-bot:#9fd0ff;--slogan-a:#7f8cff;--slogan-b:#b794ff;--glow1:rgba(16,185,129,.22);--glow2:rgba(124,92,255,.24);--glow3:rgba(34,211,238,.11);--aura:radial-gradient(circle,rgba(60,200,160,.32),rgba(120,100,255,.2) 45%,transparent 70%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Plus Jakarta Sans','Noto Sans Ethiopic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* one continuous background for splash and login */
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60rem 36rem at 50% -8%,var(--glow1),transparent 62%),radial-gradient(40rem 30rem at 100% 100%,var(--glow2),transparent 60%),radial-gradient(34rem 26rem at 0% 92%,var(--glow3),transparent 62%),var(--bg)}
.stage{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(1.4rem,env(safe-area-inset-top)) 1.5rem max(1rem,env(safe-area-inset-bottom));transition:opacity .4s ease,transform .4s ease}
.stage.leaving{opacity:0;transform:scale(1.04)}
.center{width:100%;max-width:24rem;margin:auto 0;display:flex;flex-direction:column;align-items:center;--leaf-w:min(62vw,14.5rem);--name-fs:clamp(3.6rem,19vw,5.2rem);--slogan-fs:clamp(1.1rem,5.4vw,1.4rem)}
.stage.login .center{--leaf-w:min(36vw,8.2rem);--name-fs:clamp(2.5rem,12.5vw,3.4rem);--slogan-fs:clamp(.92rem,4.3vw,1.1rem)}

/* brand */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;isolation:isolate}
.hero::before{content:"";position:absolute;top:-2rem;left:50%;width:min(96vw,26rem);aspect-ratio:1;transform:translateX(-50%);background:var(--aura);filter:blur(14px);z-index:-1;pointer-events:none}
.leaves{position:relative;width:var(--leaf-w);aspect-ratio:480/399;background:var(--leaves-img) center/100% 100% no-repeat;filter:drop-shadow(0 0 24px rgba(60,200,160,.45));transition:width .85s cubic-bezier(.2,.8,.2,1);animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.name,.slogan{position:relative;display:block;width:max-content;white-space:nowrap;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text}
.name{font-size:var(--name-fs);font-weight:800;letter-spacing:.14em;line-height:1;margin-top:.9rem;padding-left:.14em;background-image:linear-gradient(180deg,var(--vita-top) 25%,var(--vita-bot));transition:font-size .85s cubic-bezier(.2,.8,.2,1);animation:pop .9s .22s cubic-bezier(.2,.8,.2,1) both}
html[data-theme="dark"] .name{filter:drop-shadow(0 0 16px rgba(130,170,255,.42))}
.slogan{font-size:var(--slogan-fs);font-weight:500;letter-spacing:.07em;margin-top:.7rem;background-image:linear-gradient(90deg,var(--slogan-a),var(--slogan-b));transition:font-size .85s cubic-bezier(.2,.8,.2,1);animation:pop .9s .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.88)}to{opacity:1;transform:none}}
.shine{position:absolute;inset:0;display:block;pointer-events:none;-webkit-mask-image:var(--leaves-img);mask-image:var(--leaves-img);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.shine,.shine-text::after{background-repeat:no-repeat;background-size:400% 100%;background-position:72% 0;background-image:linear-gradient(100deg,transparent 44%,rgba(255,255,255,.95) 50%,transparent 56%);animation:sweep 3.2s ease-in-out infinite,hue 16s step-end infinite}
.shine-text::after{content:attr(data-text);position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text}
@keyframes sweep{0%{background-position:72% 0}70%,100%{background-position:28% 0}}
@keyframes hue{0%{background-image:linear-gradient(100deg,transparent 44%,rgba(255,255,255,.95) 50%,transparent 56%)}20%{background-image:linear-gradient(100deg,transparent 44%,rgba(168,85,247,.95) 50%,transparent 56%)}40%{background-image:linear-gradient(100deg,transparent 41%,rgba(34,211,238,.95) 46%,rgba(168,85,247,.95) 54%,transparent 59%)}60%{background-image:linear-gradient(100deg,transparent 41%,rgba(251,191,36,.95) 46%,rgba(244,114,182,.95) 54%,transparent 59%)}80%{background-image:linear-gradient(100deg,transparent 41%,rgba(52,211,153,.95) 46%,rgba(255,255,255,.95) 54%,transparent 59%)}100%{background-image:linear-gradient(100deg,transparent 44%,rgba(255,255,255,.95) 50%,transparent 56%)}}

/* login, drawn straight on the same background (no card) */
.login-wrap{width:100%;display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;margin-top:0;transition:grid-template-rows .85s cubic-bezier(.2,.8,.2,1),opacity .7s .2s ease,margin-top .85s cubic-bezier(.2,.8,.2,1)}
.stage.login .login-wrap{grid-template-rows:1fr;opacity:1;visibility:visible;margin-top:1.5rem}
.login-inner{min-height:0;overflow:hidden;padding:.35rem .3rem .2rem;text-align:center}
.login-inner h2{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
.login-inner p.sub{font-size:.78rem;font-weight:500;color:var(--muted);margin-top:.3rem}
.field{text-align:left;margin-top:1rem}
.field label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:.4rem}
.field input{width:100%;border:1px solid var(--line);background:var(--field-bg);color:var(--ink);border-radius:9999px;padding:.95rem 1.2rem;font-size:.92rem;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.field input::placeholder{color:var(--muted);opacity:.7}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(16,185,129,.22)}
.pw{position:relative}.pw input{padding-right:3.2rem}
.eye{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);width:2.6rem;height:2.6rem;background:none;border:0;color:var(--muted);display:grid;place-content:center}
.eye svg{width:1.2rem;height:1.2rem}
.row{display:flex;align-items:center;justify-content:space-between}
.mini{background:none;border:0;color:var(--brand);font-size:.72rem;font-weight:700;padding:0}
.btn{display:block;width:100%;border:0;border-radius:9999px;padding:1rem;font-size:.88rem;font-weight:800;margin-top:1.3rem;color:#fff;background:linear-gradient(135deg,#19b88a,#0f9d74);box-shadow:0 14px 28px -10px rgba(16,185,129,.7);transition:opacity .2s,transform .15s}
.btn:active{transform:scale(.97)}
.btn-off{opacity:.4;pointer-events:none;box-shadow:none}
.link{display:block;width:100%;background:none;border:0;color:var(--muted);font-size:.78rem;font-weight:600;padding:.8rem .4rem 0}
.link b{color:var(--brand);font-weight:800}
.hint{font-size:.7rem;font-weight:500;color:var(--muted);margin-top:.9rem;line-height:1.45}
.msg{min-height:1.1rem;margin-top:.7rem;font-size:.76rem;font-weight:600;color:var(--muted);line-height:1.4;text-align:center}
.msg.err{color:var(--err)}
footer{font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--muted);padding-top:1rem}
@media (max-height:640px){.stage.login .center{--leaf-w:min(26vw,5.8rem)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.shine,.shine-text::after{display:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="stage" id="stage">
  <div class="center">
    <div class="hero">
      <div class="leaves" role="img" aria-label="VITA"><i class="shine"></i></div>
      <h1 class="name shine-text" data-text="VITA">VITA</h1>
      <p class="slogan shine-text" data-text="Design Your Life">Design Your Life</p>
    </div>

    <div class="login-wrap">
      <div class="login-inner">
        <h2 id="form-heading">Welcome back</h2>
        <p class="sub" id="form-sub">Sign in to continue</p>

        <form id="form-login" novalidate>
          <div class="field">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Enter your username">
          </div>
          <div class="field">
            <div class="row"><label for="login-password">Password</label><button type="button" id="forgot" class="mini">Forgot password?</button></div>
            <div class="pw">
              <input type="password" id="login-password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
              <button type="button" class="eye" data-for="login-password" aria-label="Show password"></button>
            </div>
          </div>
          <button type="submit" id="login-btn" class="btn btn-off">Sign in</button>
          <button type="button" class="link" id="to-register">Don't have an account? <b>Create account</b></button>
        </form>

        <form id="form-register" class="hidden" novalidate>
          <div class="field">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Choose a username">
          </div>
          <div class="field">
            <label for="reg-password">Create password</label>
            <div class="pw">
              <input type="password" id="reg-password" autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
              <button type="button" class="eye" data-for="reg-password" aria-label="Show password"></button>
            </div>
          </div>
          <button type="submit" id="reg-btn" class="btn btn-off">Register</button>
          <button type="button" class="link" id="to-login">Already have an account? <b>Sign in</b></button>
        </form>

        <p class="hint">The first sign-in needs internet. After that VITA stays signed in and works offline.</p>
        <p id="msg" class="msg" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
  <footer>created by Agb &copy; 2026</footer>
</div>

<script>
(function () {
  var CFG = { apiKey: "AIzaSyBYinVdxtvYwTjD_KKpPTpYUBlVoyknJPw", authDomain: "dailytaskapp-20859.firebaseapp.com", projectId: "dailytaskapp-20859", storageBucket: "dailytaskapp-20859.firebasestorage.app", messagingSenderId: "132633352057", appId: "1:132633352057:web:81bd7b2c88efbc16e881a8", databaseURL: "https://dailytaskapp-20859-default-rtdb.firebaseio.com" };
  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-10-7-10-7a18.5 18.5 0 0 1 4.06-5.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
  var SPLASH_MS = 2000;
  var $ = function (id) { return document.getElementById(id); };
  var auth = null, mode = 'login';

  function say(t, kind) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  function fmtEmail(u) { return u.trim().toLowerCase().replace(/\s+/g, '') + '@taskcontroller.local'; }
  function fbInit() {
    if (typeof firebase === 'undefined') return false;
    if (!firebase.apps.length) firebase.initializeApp(CFG);
    auth = firebase.auth();
    return true;
  }
  function authErr(e) {
    var c = e && e.code;
    if (c === 'auth/network-request-failed') return 'No internet connection. Connect and try again.';
    if (c === 'auth/user-not-found') return 'This account does not exist.';
    if (c === 'auth/wrong-password' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials') return 'Incorrect username or password.';
    if (c === 'auth/email-already-in-use') return 'This username is already registered.';
    if (c === 'auth/invalid-email') return 'Invalid username.';
    if (c === 'auth/weak-password') return 'Password is too weak. Use at least 6 characters.';
    if (c === 'auth/too-many-requests') return 'Too many attempts. Please try again later.';
    return 'Something went wrong. Please try again.';
  }

  /* signed in = the phone remembers the account until the user signs out */
  function finish(username, uid) {
    var prev = localStorage.getItem('last_uid');
    if (prev && prev !== uid) { var t = localStorage.getItem('theme'); localStorage.clear(); if (t) localStorage.setItem('theme', t); }
    localStorage.setItem('username', username);
    localStorage.setItem('userId', uid);
    localStorage.setItem('last_uid', uid);
    $('stage').classList.add('leaving');
    setTimeout(function () { location.replace('dashboard.html'); }, 380);
  }

  function validate() {
    var lu = $('login-username').value.trim(), lp = $('login-password').value;
    $('login-btn').classList.toggle('btn-off', !(lu.length >= 3 && lp.length >= 6));
    var ru = $('reg-username').value.trim(), rp = $('reg-password').value;
    $('reg-btn').classList.toggle('btn-off', !(ru.length >= 3 && rp.length >= 6));
  }
  function setMode(m) {
    mode = m; say('');
    $('form-login').classList.toggle('hidden', m !== 'login');
    $('form-register').classList.toggle('hidden', m !== 'register');
    $('form-heading').textContent = m === 'login' ? 'Welcome back' : 'Create account';
    $('form-sub').textContent = m === 'login' ? 'Sign in to continue' : 'Set up your username and password';
    validate();
  }
  async function submit(kind, e) {
    e.preventDefault();
    var uEl = $(kind === 'login' ? 'login-username' : 'reg-username'), pEl = $(kind === 'login' ? 'login-password' : 'reg-password');
    var u = uEl.value.trim(), p = pEl.value, btn = $(kind === 'login' ? 'login-btn' : 'reg-btn'), label = btn.textContent;
    say('');
    if (u.length < 3 || p.length < 6) { say('Enter your username and a password of at least 6 characters.', 'err'); return; }
    if (kind === 'register' && !/^[a-zA-Z0-9_]+$/.test(u)) { say('Use only letters, numbers and underscore (_) in your username.', 'err'); return; }
    if (!navigator.onLine) { say('You are offline. Connect to the internet to sign in once - after that VITA works offline.', 'err'); return; }
    if (!fbInit()) { say('Could not load the sign-in service. Check your connection and reload.', 'err'); return; }
    btn.classList.add('btn-off'); btn.textContent = 'Please wait...';
    try {
      var res = kind === 'login' ? await auth.signInWithEmailAndPassword(fmtEmail(u), p) : await auth.createUserWithEmailAndPassword(fmtEmail(u), p);
      finish(u, res.user.uid);
    } catch (err) {
      btn.textContent = label; validate(); say(authErr(err), 'err');
    }
  }

  function init() {
    document.querySelectorAll('.eye').forEach(function (b) {
      b.innerHTML = EYE_OFF;
      b.addEventListener('click', function () {
        var i = $(b.getAttribute('data-for')), show = i.type === 'password';
        i.type = show ? 'text' : 'password'; b.innerHTML = show ? EYE : EYE_OFF;
      });
    });
    ['login-username', 'login-password', 'reg-username', 'reg-password'].forEach(function (id) { $(id).addEventListener('input', validate); });
    $('form-login').addEventListener('submit', function (e) { submit('login', e); });
    $('form-register').addEventListener('submit', function (e) { submit('register', e); });
    $('to-register').addEventListener('click', function () { setMode('register'); });
    $('to-login').addEventListener('click', function () { setMode('login'); });
    $('forgot').addEventListener('click', function () { say('Password reset is not available yet. Please keep your password safe.'); });

    // clean up keys from the removed fingerprint / PIN version
    ['vita_linked', 'vita_pwh', 'vita_cred', 'vita_pin', 'vita_fail', 'vita_until'].forEach(function (k) { localStorage.removeItem(k); });
    try { sessionStorage.removeItem('vita_unlocked'); } catch (e) {}

    var forced = /[?&]login=1/.test(location.search);
    var signedIn = !!localStorage.getItem('userId') && !forced;
    if (signedIn) { var l = document.createElement('link'); l.rel = 'prefetch'; l.href = 'dashboard.html'; document.head.appendChild(l); }

    setTimeout(function () {
      var stage = $('stage');
      if (signedIn) {
        stage.classList.add('leaving');
        setTimeout(function () { location.replace('dashboard.html'); }, 380);
      } else {
        stage.classList.add('login');
        if (forced) say('Please sign in again.');
      }
    }, SPLASH_MS);

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  init();
})();
</script>
</body>
</html>
