<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - Device & Task Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Firebase App & Auth/Database Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYinVdxtvYwTjD_KKpPTpYUBlVoyknJPw",
            authDomain: "dailytaskapp-20859.firebaseapp.com",
            databaseURL: "https://dailytaskapp-20859-default-rtdb.firebaseio.com",
            projectId: "dailytaskapp-20859",
            storageBucket: "dailytaskapp-20859.firebasestorage.app",
            messagingSenderId: "132633352057",
            appId: "1:132633352057:web:81bd7b2c88efbc16e881a8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // ተጠቃሚውን ማረጋገጥና መረጃዎችን ማሳየት (በUsername/Email ሲስተም)
        onAuthStateChanged(auth, (user) => {
            const savedUsername = localStorage.getItem('username');
            if (user || savedUsername) {
                const displayUser = savedUsername || (user && user.email ? user.email.split('@')[0] : "User");
                document.getElementById('user-email-display').innerText = displayUser;
                
                if (user && user.photoURL) {
                    setProfileImage(user.photoURL);
                }
            } else {
                // ወደ መግቢያ ገጽ መመለስ ካሻ
                window.location.href = "index.html";
            }
            
            const savedImage = localStorage.getItem('local_profile_image');
            if (savedImage) {
                setProfileImage(savedImage);
            }
        });

        function setProfileImage(url) {
            const imgElement = document.getElementById('user-avatar');
            const iconElement = document.getElementById('default-avatar-icon');
            imgElement.src = url;
            imgElement.classList.remove('hidden');
            iconElement.classList.add('hidden');
        }

        document.addEventListener("DOMContentLoaded", () => {
            // 1. የፎቶ መምረጫ (Gallery) ሎጂክ
            const editPhotoBtn = document.getElementById('edit-photo-btn');
            const fileInput = document.getElementById('profile-photo-input');

            editPhotoBtn.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const imageUrl = e.target.result;
                        setProfileImage(imageUrl);
                        localStorage.setItem('local_profile_image', imageUrl);
                    }
                    reader.readAsDataURL(file);
                }
            });

            // 2. የ Logout Modal ሎጂክ (ፍጥነቱ ተስተካክሏል)
            const logoutModal = document.getElementById('logout-modal');
            const logoutModalContent = document.getElementById('logout-modal-content');
            const openLogoutBtn = document.getElementById('open-logout-btn');
            const cancelLogoutBtn = document.getElementById('cancel-logout-btn');
            const closeLogoutIcon = document.getElementById('close-modal-icon');
            const confirmLogoutBtn = document.getElementById('confirm-logout-btn');

            function openLogout() {
                logoutModal.classList.remove('hidden');
                logoutModal.classList.add('flex');
                setTimeout(() => {
                    logoutModalContent.classList.remove('translate-y-full');
                }, 5);
            }

            function closeLogout() {
                logoutModalContent.classList.add('translate-y-full');
                setTimeout(() => {
                    logoutModal.classList.add('hidden');
                    logoutModal.classList.remove('flex');
                }, 75);
            }

            openLogoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                openLogout();
            });

            cancelLogoutBtn.addEventListener('click', closeLogout);
            closeLogoutIcon.addEventListener('click', closeLogout);

            logoutModal.addEventListener('click', (e) => {
                if (e.target === logoutModal) closeLogout();
            });

            confirmLogoutBtn.addEventListener('click', () => {
                signOut(auth).then(() => {
                    localStorage.removeItem('username');
                    localStorage.removeItem('userId');
                    localStorage.removeItem('local_profile_image');
                    closeLogout();
                    window.location.href = "index.html";
                }).catch(() => {
                    closeLogout();
                });
            });

            // 3. የ Language Modal ሎጂክ (ፍጥነቱ ተስተካክሏል)
            const langModal = document.getElementById('lang-modal');
            const langModalContent = document.getElementById('lang-modal-content');
            const openLangBtn = document.getElementById('open-lang-btn');
            const closeLangIcon = document.getElementById('close-lang-icon');
            const langRadioEn = document.getElementById('lang-en');
            const langRadioAm = document.getElementById('lang-am');
            const currentLangDisplay = document.getElementById('current-lang-display');
            const langModalTitle = document.getElementById('lang-modal-title');

            const savedLang = localStorage.getItem('app_lang') || 'en';
            if (savedLang === 'am') {
                langRadioAm.checked = true;
                applyLanguage('am');
            } else {
                langRadioEn.checked = true;
                applyLanguage('en');
            }

            function openLangModal() {
                langModal.classList.remove('hidden');
                langModal.classList.add('flex');
                setTimeout(() => {
                    langModalContent.classList.remove('translate-y-full');
                }, 5);
            }

            function closeLangModal() {
                langModalContent.classList.add('translate-y-full');
                setTimeout(() => {
                    langModal.classList.add('hidden');
                    langModal.classList.remove('flex');
                }, 75);
            }

            openLangBtn.addEventListener('click', (e) => {
                e.preventDefault();
                openLangModal();
            });

            closeLangIcon.addEventListener('click', closeLangModal);
            langModal.addEventListener('click', (e) => {
                if (e.target === langModal) closeLangModal();
            });

            langRadioEn.addEventListener('change', () => {
                if (langRadioEn.checked) {
                    localStorage.setItem('app_lang', 'en');
                    applyLanguage('en');
                    setTimeout(closeLangModal, 50);
                }
            });

            langRadioAm.addEventListener('change', () => {
                if (langRadioAm.checked) {
                    localStorage.setItem('app_lang', 'am');
                    applyLanguage('am');
                    setTimeout(closeLangModal, 50);
                }
            });

            function applyLanguage(lang) {
                if (lang === 'am') {
                    currentLangDisplay.innerText = "አማርኛ";
                    document.getElementById('nav-title').innerText = "መገለጫ";
                    document.getElementById('menu-lang-title').innerText = "ቋንቋ";
                    document.getElementById('menu-logout-title').innerText = "ውጣ";
                    langModalTitle.innerText = "ቋንቋ";
                    document.getElementById('logout-title-text').innerText = "ውጣ";
                    document.getElementById('logout-question-text').innerText = "እርግጠኛ ኖት መውጣት ይፈልጋሉ?";
                    document.getElementById('confirm-logout-btn').innerText = "ውጣ";
                    document.getElementById('cancel-logout-btn').innerText = "ይቅር";
                } else {
                    currentLangDisplay.innerText = "English";
                    document.getElementById('nav-title').innerText = "Profile";
                    document.getElementById('menu-lang-title').innerText = "Language";
                    document.getElementById('menu-logout-title').innerText = "Logout";
                    langModalTitle.innerText = "Language";
                    document.getElementById('logout-title-text').innerText = "Log out";
                    document.getElementById('logout-question-text').innerText = "Are you sure you want to log out?";
                    document.getElementById('confirm-logout-btn').innerText = "Log out";
                    document.getElementById('cancel-logout-btn').innerText = "Cancel";
                }
            }
        });
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        /* የዳሽቦርዱ ዓይነት ጥቁር የጀርባ ከለር (Radial Gradient) */
        .custom-gradient-bg {
            background: radial-gradient(
                circle at center,
                #1a1a2e 0%,
                #0f0f1a 100%
            );
        }
    </style>
</head>
<body class="custom-gradient-bg text-slate-900 min-h-screen flex flex-col justify-between p-4 relative">

    <!-- Top Navigation Bar -->
    <header class="w-full max-w-lg mx-auto flex items-center justify-between py-3 px-3">
        <a href="dashboard.html" class="flex items-center justify-center w-11 h-11 text-white bg-slate-950/50 hover:bg-slate-950/70 rounded-2xl border border-white/10 transition-all duration-200 active:scale-95 shadow-inner">
            <i class="fa-solid fa-arrow-left text-base font-black" style="color: #FFB81C;"></i>
        </a>
        <span id="nav-title" class="font-black text-lg tracking-tight drop-shadow" style="color: #FFB81C;">Profile</span>
        <div class="w-11"></div>
    </header>

    <!-- Main Container Card -->
    <main class="w-full max-w-lg mx-auto bg-slate-900/70 text-slate-100 rounded-[35px] shadow-2xl border border-white/10 p-8 mt-1 mb-auto backdrop-blur-sm">
        
        <!-- Profile Header: Photo & Username -->
        <div class="flex flex-col items-center text-center pb-8 border-b border-white/10">
            <div class="relative mb-4">
                <div class="w-28 h-28 rounded-full bg-slate-900 border-3 border-emerald-400 flex items-center justify-center overflow-hidden shadow-2xl">
                    <i id="default-avatar-icon" class="fa-solid fa-user text-4xl text-slate-400"></i>
                    <img id="user-avatar" src="" alt="Profile Photo" class="w-full h-full object-cover hidden">
                </div>
                
                <input type="file" id="profile-photo-input" accept="image/*" class="hidden">
                
                <div id="edit-photo-btn" class="absolute bottom-1 right-1 w-8 h-8 bg-emerald-500 rounded-full flex items-center justify-center text-slate-950 shadow-lg cursor-pointer hover:scale-110 transition-transform">
                    <i class="fa-solid fa-pen text-xs font-bold"></i>
                </div>
            </div>
            <h2 id="user-email-display" class="text-base font-extrabold text-emerald-400 tracking-wider">loading...</h2>
            <p class="text-xs text-slate-300 font-medium mt-1">Connected Username</p>
        </div>

        <!-- Menu List Links -->
        <div class="mt-6 space-y-3">
            
            <!-- Language Option Trigger -->
            <a href="#" id="open-lang-btn" class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/60 hover:bg-slate-800 border border-white/10 transition-all duration-200">
                <div class="flex items-center space-x-4">
                    <div class="w-6 flex justify-center text-emerald-400 text-lg">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <div>
                        <span id="menu-lang-title" class="text-base font-bold text-slate-100 block">Language</span>
                        <span id="current-lang-display" class="text-xs text-slate-400 font-semibold block">English</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-sm text-slate-400"></i>
            </a>

            <!-- Accounts Tracker -->
            <a href="Accounts Tracker.html" class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/60 hover:bg-slate-800 border border-white/10 transition-all duration-200">
                <div class="flex items-center space-x-4">
                    <div class="w-6 flex justify-center text-emerald-400 text-lg">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="text-base font-bold text-slate-100">Accounts Tracker</span>
                </div>
                <i class="fa-solid fa-chevron-right text-sm text-slate-400"></i>
            </a>

            <!-- Manage Accounts -->
            <a href="manage accounts.html" class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/60 hover:bg-slate-800 border border-white/10 transition-all duration-200">
                <div class="flex items-center space-x-4">
                    <div class="w-6 flex justify-center text-emerald-400 text-lg">
                        <i class="fa-solid fa-user-gear"></i>
                    </div>
                    <span class="text-base font-bold text-slate-100">Manage Accounts</span>
                </div>
                <i class="fa-solid fa-chevron-right text-sm text-slate-400"></i>
            </a>

            <!-- Logout Button -->
            <button id="open-logout-btn" class="w-full flex items-center justify-between p-4 rounded-2xl bg-red-500/15 hover:bg-red-500/25 border border-red-500/30 transition-all duration-200 mt-4">
                <div class="flex items-center space-x-4">
                    <div class="w-6 flex justify-center text-red-400 text-lg">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </div>
                    <span id="menu-logout-title" class="text-base font-bold text-red-400">Logout</span>
                </div>
                <i class="fa-solid fa-chevron-right text-sm text-red-400"></i>
            </button>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-lg mx-auto text-center py-3">
        <p class="text-xs font-black tracking-wider text-slate-300">Device & Task Controller Suite © 2026</p>
    </footer>

    <!-- ================= LANGUAGE MODAL (Bottom Sheet) ================= -->
    <div id="lang-modal" class="fixed inset-0 bg-slate-950/80 z-50 hidden flex-col justify-end transition-opacity">
        <div id="lang-modal-content" class="w-full max-w-lg mx-auto bg-slate-950/95 border-t border-white/15 rounded-t-[35px] p-6 pb-8 transform translate-y-full transition-transform duration-75 shadow-2xl text-slate-100">
            <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-4"></div>
            <div class="flex justify-center items-center mb-6 relative">
                <h3 id="lang-modal-title" class="text-slate-100 font-extrabold text-xl">Language</h3>
                <button id="close-lang-icon" class="absolute right-0 w-8 h-8 bg-white/10 rounded-full flex items-center justify-center text-slate-300 hover:bg-white/20 transition-colors">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <div class="space-y-3 mb-4">
                <label class="flex items-center justify-between p-4 rounded-2xl bg-slate-900/60 hover:bg-slate-950 border border-white/10 cursor-pointer transition-all">
                    <span class="text-base font-semibold text-slate-100">English</span>
                    <input type="radio" name="language_option" id="lang-en" class="w-5 h-5 accent-emerald-500 cursor-pointer" checked>
                </label>
                <label class="flex items-center justify-between p-4 rounded-2xl bg-slate-900/60 hover:bg-slate-950 border border-white/10 cursor-pointer transition-all">
                    <span class="text-base font-semibold text-slate-100">አማርኛ</span>
                    <input type="radio" name="language_option" id="lang-am" class="w-5 h-5 accent-emerald-500 cursor-pointer">
                </label>
            </div>
        </div>
    </div>

    <!-- ================= LOGOUT MODAL ================= -->
    <div id="logout-modal" class="fixed inset-0 bg-slate-950/80 z-50 hidden flex-col justify-end transition-opacity">
        <div id="logout-modal-content" class="w-full max-w-lg mx-auto bg-slate-950/95 border-t border-white/15 rounded-t-[35px] p-8 pb-10 transform translate-y-full transition-transform duration-75 shadow-2xl text-slate-100">
            <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-6"></div>
            <div class="flex justify-center items-center mb-5 relative">
                <h3 id="logout-title-text" class="text-slate-100 font-extrabold text-xl">Log out</h3>
                <button id="close-modal-icon" class="absolute right-0 w-8 h-8 bg-white/10 rounded-full flex items-center justify-center text-slate-300 hover:bg-white/20 transition-colors">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <p id="logout-question-text" class="text-center text-slate-300 text-base mb-8 font-medium">Are you sure you want to log out?</p>
            <button id="confirm-logout-btn" class="w-full bg-[#ff2a55] text-white font-bold text-base py-4 rounded-full mb-3 hover:bg-[#e02047] active:scale-[0.98] transition-all shadow-lg">
                Log out
            </button>
            <button id="cancel-logout-btn" class="w-full bg-white/5 border border-white/15 text-slate-200 font-bold text-base py-4 rounded-full hover:bg-white/10 active:scale-[0.98] transition-all">
                Cancel
            </button>
        </div>
    </div>

</body>
</html>
